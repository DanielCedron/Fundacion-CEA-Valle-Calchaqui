<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuixLauncher - Panel Dinámico</title>
    <!-- Librería Cropper.js para recortar imágenes -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px;
        }
        .container {
            background-color: #1e1e1e; padding: 30px; border-radius: 15px; width: 100%; max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); border: 1px solid #333;
        }
        h1 { text-align: center; border-bottom: 2px solid #4CAF50; padding-bottom: 15px; margin-top: 0; color: #4CAF50; }
        .step-container { background-color: #2a2a2a; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #4CAF50; }
        .step-title { margin-top: 0; color: #fff; font-size: 16px; margin-bottom: 15px; }
        .step-title span { background-color: #4CAF50; color: black; padding: 2px 8px; border-radius: 50%; font-weight: bold; margin-right: 10px; }
        label { display: block; margin-bottom: 8px; color: #bbb; font-size: 13px; }
        select, input[type="text"], input[type="file"] {
            width: 100%; padding: 12px; margin-bottom: 15px; background-color: #151515; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box;
        }
        
        /* Contenedor de edición de imagen (Corregido sin Flexbox) */
        .editor-box {
            width: 100%; max-width: 400px; height: 400px; background-color: #151515;
            border: 2px dashed #555; border-radius: 8px; margin: 0 auto 15px auto;
            position: relative;
            overflow: hidden;
        }
        .editor-box img { 
            display: none; 
            max-width: 100%; 
            max-height: 100%; 
            margin: auto; 
        }
        #previewText {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #666; font-size: 14px; text-align: center; width: 100%;
        }

        button.submit-btn { width: 100%; padding: 15px; background-color: #4CAF50; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.3s; }
        button.submit-btn:hover { background-color: #45a049; }
        button.submit-btn:disabled { background-color: #555; cursor: not-allowed; }
        .status { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; padding: 10px; border-radius: 6px; display: none; }
        .success { background-color: rgba(76, 175, 80, 0.2); color: #4CAF50; display: block;}
        .error { background-color: rgba(244, 67, 54, 0.2); color: #f44336; display: block;}
        .loading { background-color: rgba(255, 193, 7, 0.2); color: #ffc107; display: block;}
    </style>
</head>
<body>

    <div class="container">
        <h1>QuixLauncher Admin</h1>

        <!-- PASO 1 y 2 -->
        <div style="display: flex; gap: 15px;">
            <div class="step-container" style="flex: 1;">
                <h3 class="step-title"><span>1</span> Categoría</h3>
                <select id="selCategoria">
                    <option value="nov">Inicio (Carteles)</option>
                    <option value="juego_id">Juegos (Botones)</option>
                    <option value="tienda_id">Tienda (Botones)</option>
                    <option value="club_id">Club (Botones)</option>
                </select>
            </div>
            <div class="step-container" style="flex: 1;">
                <h3 class="step-title"><span>2</span> Slot</h3>
                <select id="selSlot"></select>
            </div>
        </div>

        <!-- PASO 3 -->
        <div class="step-container">
            <h3 class="step-title"><span>3</span> Recortar Imagen y Destino</h3>
            
            <label>Adjuntar Imagen (Arrástrala y ajusta el zoom):</label>
            <input type="file" id="fileInput" accept="image/*">

            <div class="editor-box" id="editorContainer">
                <span id="previewText">La imagen aparecerá aquí para recortar</span>
                <img id="imgPreview" src="" alt="Vista previa">
            </div>
            
            <label>Enlace de destino:</label>
            <input type="text" id="urlInput" placeholder="Ej: https... o escribe 'no' para anular">
        </div>

        <button id="btnSubir" class="submit-btn" onclick="iniciarSubida()">RECORTAR Y SUBIR AL LAUNCHER</button>
        <div id="statusBox" class="status"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref as dbRef, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const IMGBB_API_KEY = "68faba876c6a75e2a3569b6467f976d1";
        const firebaseConfig = { databaseURL: "https://quix-ce6d9-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const selCategoria = document.getElementById('selCategoria');
        const selSlot = document.getElementById('selSlot');
        const fileInput = document.getElementById('fileInput');
        const imgPreview = document.getElementById('imgPreview');
        const previewText = document.getElementById('previewText');
        const urlInput = document.getElementById('urlInput');
        const statusBox = document.getElementById('statusBox');
        const btnSubir = document.getElementById('btnSubir');

        let cropper;

        function actualizarSlots() {
            selSlot.innerHTML = '';
            const maxSlots = selCategoria.value === 'nov' ? 4 : 6; 
            for (let i = 1; i <= maxSlots; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `Posición ${i}`;
                selSlot.appendChild(option);
            }
        }

        actualizarSlots();
        selCategoria.addEventListener('change', actualizarSlots);

        // Inicializar el recortador manual corregido con delay
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imgPreview.src = event.target.result;
                    imgPreview.style.display = 'block';
                    previewText.style.display = 'none';
                    
                    if (cropper) cropper.destroy();

                    // Esperar a que el navegador dibuje la imagen físicamente en el DOM
                    setTimeout(() => {
                        cropper = new Cropper(imgPreview, {
                            aspectRatio: 240 / 350,
                            viewMode: 1,
                            background: false
                        });
                    }, 100);
                }
                reader.readAsDataURL(file);
            }
        });

        window.iniciarSubida = async function() {
            const linkDestinoRaw = urlInput.value.trim();
            const slotElegido = selCategoria.value + selSlot.value;

            if (!cropper) { mostrarMensaje("Error: Debes adjuntar una imagen.", "error"); return; }
            if (linkDestinoRaw === "") { mostrarMensaje("Error: Coloca un enlace o la palabra 'no'.", "error"); return; }

            const linkFinal = linkDestinoRaw.toLowerCase() === 'no' ? "" : linkDestinoRaw;
            btnSubir.disabled = true;
            mostrarMensaje("Paso 1: Procesando recorte y subiendo a ImgBB...", "loading");

            // Generar recorte con la proporción exacta del Launcher
            cropper.getCroppedCanvas({ width: 240, height: 350 }).toBlob(async (blob) => {
                try {
                    const formData = new FormData();
                    formData.append("image", blob, "recorte.jpg");

                    const respuestaImgbb = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, {
                        method: "POST", body: formData
                    });
                    
                    const datosImgbb = await respuestaImgbb.json();
                    if (!datosImgbb.success) throw new Error("Error con ImgBB.");
                    
                    mostrarMensaje("Paso 2: Conectando a Firebase...", "loading");

                    await set(dbRef(db, 'novedades/' + slotElegido), {
                        imagen: datosImgbb.data.url,
                        url: linkFinal
                    });

                    mostrarMensaje(`¡Éxito! El slot ${slotElegido} ha sido actualizado.`, "success");
                    
                    // Limpieza
                    setTimeout(() => { 
                        statusBox.style.display = 'none'; 
                        if (cropper) cropper.destroy(); 
                        cropper = null;
                        imgPreview.style.display = 'none';
                        previewText.style.display = 'block';
                        fileInput.value = "";
                    }, 4000);

                } catch (error) {
                    mostrarMensaje("Error: " + error.message, "error");
                } finally {
                    btnSubir.disabled = false;
                }
            }, 'image/jpeg', 0.9);
        };

        function mostrarMensaje(texto, tipo) {
            statusBox.textContent = texto;
            statusBox.className = "status " + tipo;
        }
    </script>
</body>
</html>
